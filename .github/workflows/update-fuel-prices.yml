# Daily sync of Kathmandu NOC petrol/diesel into prices.json
# The website also fetches live NOC rates in the browser; this file is a reliable fallback.
name: Update NOC Fuel Prices

on:
  schedule:
    # Twice daily (NOC often revises around midnight / midday NPT)
    - cron: '15 0 * * *'   # ~05:45–06:00 NPT
    - cron: '15 12 * * *'  # ~18:00 NPT
  workflow_dispatch:       # Manual run from GitHub Actions tab
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/update-fuel-prices.yml'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch NOC Kathmandu prices and write prices.json
        shell: bash
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json
          import re
          import urllib.request
          from datetime import datetime, timezone

          MARGIN = 1.50
          URLS = [
              "https://noc.org.np/retailprice",
              "https://r.jina.ai/https://noc.org.np/retailprice",
              "https://r.jina.ai/http://noc.org.np/retailprice",
          ]

          def fetch(url: str) -> str:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PanchakanyaOilStoresPriceBot/1.0 (+https://github.com/umesh4125/panchakanya-website)",
                      "Accept": "text/html,text/plain,*/*",
                  },
              )
              with urllib.request.urlopen(req, timeout=45) as resp:
                  return resp.read().decode("utf-8", errors="replace")

          def parse(text: str):
              # Prefer official history table (latest row) — banner can lag.
              # Raw NOC HTML has multi-line <td> cells; allow wide gaps.
              table_pats = [
                  # HTML: 2083.04.17(2026.08.02)</td> ... <td>24:00 hrs</td> ... 200.00 ... 200.00
                  r"\d{4}[./-]\d{1,2}[./-]\d{1,2}\s*\(\s*(20\d{2}[./-]\d{1,2}[./-]\d{1,2})\s*\)[\s\S]{0,300}?(24\s*:\s*00\s*hrs?|00\s*:\s*00\s*hrs?|[\d:]+\s*hrs?)[\s\S]{0,300}?(\d{2,3}(?:\.\d{1,2})?)[\s\S]{0,200}?(\d{2,3}(?:\.\d{1,2})?)",
                  # Markdown/plain from jina reader
                  r"\d{4}[./-]\d{1,2}[./-]\d{1,2}\s*\(\s*(20\d{2}[./-]\d{1,2}[./-]\d{1,2})\s*\)[\s\S]{0,80}?(24\s*:\s*00|00\s*:\s*00|[\d:]+\s*hrs?)[\s\S]{0,80}?(\d{2,3}(?:\.\d{1,2})?)\s*[|\s]+\s*(\d{2,3}(?:\.\d{1,2})?)",
                  r"\|\s*\d{4}[./-]\d{1,2}[./-]\d{1,2}\s*\(\s*(20\d{2}[./-]\d{1,2}[./-]\d{1,2})\s*\)\s*\|\s*([^|]+)\|\s*(\d{2,3}(?:\.\d{1,2})?)\s*\|\s*(\d{2,3}(?:\.\d{1,2})?)\s*\|",
              ]
              for pat in table_pats:
                  m = re.search(pat, text, re.I)
                  if m:
                      petrol, diesel = float(m.group(3)), float(m.group(4))
                      if 50 <= petrol <= 500 and 50 <= diesel <= 500:
                          return {
                              "petrol": petrol,
                              "diesel": diesel,
                              "ad_date": m.group(1),
                              "time": m.group(2).strip(),
                          }

              banner_pats = [
                  r"Kathmandu[\s\S]{0,120}?Petrol\s*\(MS\)\s*:?\s*NRs?\s*([\d.]+)\s*/?\s*L[\s\S]{0,160}?Diesel\s*\(HSD\)\s*:?\s*NRs?\s*([\d.]+)\s*/?\s*L",
                  r"Kathmandu[,\s]+Pokhara[,\s]+Dipayal[\s\S]{0,500}?Petrol\s*\(MS\)[\s\S]{0,40}?Rs\.?\s*([\d.]+)[\s\S]{0,200}?Diesel\s*\(HSD\)[\s\S]{0,40}?Rs\.?\s*([\d.]+)",
              ]
              for pat in banner_pats:
                  m = re.search(pat, text, re.I)
                  if m:
                      petrol, diesel = float(m.group(1)), float(m.group(2))
                      if 50 <= petrol <= 500 and 50 <= diesel <= 500:
                          return {"petrol": petrol, "diesel": diesel, "ad_date": None, "time": None}
              return None

          def effective_label(ad_date, time_hint):
              if not ad_date:
                  return None
              parts = re.split(r"[./-]", str(ad_date))
              if len(parts) < 3:
                  return str(ad_date)
              y, mo, d = int(parts[0]), int(parts[1]), int(parts[2])
              months = [
                  "January", "February", "March", "April", "May", "June",
                  "July", "August", "September", "October", "November", "December",
              ]
              month = months[mo - 1] if 1 <= mo <= 12 else parts[1]
              th = time_hint or ""
              if re.search(r"24\s*:?\s*00|00\s*:?\s*00|midnight", th, re.I) or not th:
                  return f"{d} {month} {y}, 12:00 midnight (NPT)"
              return f"{d} {month} {y}, {th} (NPT)"

          last_err = None
          prices = None
          used = None
          for url in URLS:
              try:
                  text = fetch(url)
                  prices = parse(text)
                  if prices:
                      used = url
                      break
              except Exception as e:
                  last_err = e
                  print(f"warn: {url}: {e}")

          if not prices:
              raise SystemExit(f"Failed to parse NOC prices. Last error: {last_err}")

          petrol, diesel = prices["petrol"], prices["diesel"]
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          label = effective_label(prices.get("ad_date"), prices.get("time"))
          payload = {
              "source": "Nepal Oil Corporation (Kathmandu, Pokhara, Dipayal)",
              "fetched_from": used,
              "updated": now,
              "effective": now,
              "effective_npt": f"{prices.get('ad_date')} {prices.get('time')}" if prices.get("ad_date") else None,
              "effective_label": label,
              "noc_ad_date": prices.get("ad_date"),
              "kathmandu": {"petrol": petrol, "diesel": diesel},
              "margin_rs": MARGIN,
              "our_price": {
                  "petrol": round(petrol + MARGIN, 2),
                  "diesel": round(diesel + MARGIN, 2),
              },
              "note": "Panchakanya Oil Stores price = Kathmandu NOC + Rs 1.50",
          }
          with open("prices.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Commit updated prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "No price change — nothing to commit."
          else
            git commit -m "chore: sync Kathmandu NOC petrol/diesel prices"
            git push
          fi
